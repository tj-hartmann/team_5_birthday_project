name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.9.8"

      - name: Sync project
        run: uv sync --locked

      - name: Run Ruff linter
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.9.8"
          python-version: ${{ matrix.python-version }}

      - name: Sync project
        run: uv sync --locked

      - name: Debug test discovery
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f
          git ls-files tests
          uv run --locked pytest --collect-only -vv

      - name: Run tests
        run: uv run --locked pytest -q
